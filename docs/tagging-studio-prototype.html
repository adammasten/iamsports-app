<title>IamSports — Tagging Studio</title>
<style>
  :root {
    --bg:#0b0c10; --panel:#14161c; --panel-2:#1b1e26; --line:#262a34; --line-soft:#1e222b;
    --text:#f2f3f6; --text-dim:#9096a3; --text-faint:#5b616e;
    --accent:#6c5ce7; --accent-glow:#6c5ce755;
    --players:#a78bfa; --offense:#4a90e2; --offense-bg:#4a90e222;
    --defense:#e2574a; --defense-bg:#e2574a22; --plays:#3ec46d; --plays-bg:#3ec46d22;
    --made:#3ec46d; --miss:#6b7280; --star:#f5c518; --poe:#ff9f43;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif; background:var(--bg); color:var(--text); height:100vh; overflow:hidden; display:flex; flex-direction:column; }

  /* ===== TOP BAR ===== */
  .topbar { height:52px; flex-shrink:0; display:flex; align-items:center; gap:16px; padding:0 18px; background:var(--panel); border-bottom:1px solid var(--line); }
  .brand { display:flex; align-items:center; gap:9px; font-weight:800; font-size:15px; letter-spacing:-0.3px; }
  .brand .logo { width:26px; height:26px; border-radius:7px; background:linear-gradient(135deg,var(--accent),#8b7ef0); display:flex; align-items:center; justify-content:center; font-size:13px; }
  .game-label { color:var(--text-dim); font-size:13px; }
  .game-label b { color:var(--text); font-weight:700; }
  .period-tabs { display:flex; gap:4px; margin-left:6px; }
  .period-tabs button { background:var(--panel-2); border:1px solid var(--line); color:var(--text-dim); font-size:12px; font-weight:700; padding:5px 12px; border-radius:7px; cursor:pointer; transition:all .12s; }
  .period-tabs button.active { background:var(--accent); border-color:var(--accent); color:#fff; }
  .mode-toggle { background:transparent; border:1px solid var(--line); color:var(--text-dim); font-size:11px; font-weight:700; padding:5px 10px; border-radius:7px; cursor:pointer; margin-left:2px; }
  .mode-toggle:hover { color:var(--text); border-color:var(--text-faint); }
  .topbar-right { margin-left:auto; display:flex; align-items:center; gap:12px; }
  .autosave { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--text-dim); font-weight:600; }
  .autosave .dot { width:7px; height:7px; border-radius:50%; background:var(--made); box-shadow:0 0 8px #3ec46d99; }
  .avatar { width:28px; height:28px; border-radius:50%; background:var(--panel-2); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; }

  /* ===== MAIN LAYOUT ===== */
  .main { flex:1; display:flex; min-height:0; }
  .stage { flex:1; display:flex; flex-direction:column; min-width:0; }
  .clips-panel { width:300px; flex-shrink:0; background:var(--panel); border-left:1px solid var(--line); display:flex; flex-direction:column; }

  /* ===== VIDEO (centered 16:9 frame, letterboxed on wide screens) ===== */
  .video { flex:1; min-height:0; background:#000; display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .video-frame { position:relative; aspect-ratio:16/9; max-height:100%; max-width:100%; display:flex; align-items:center; justify-content:center;
    background-image: linear-gradient(rgba(11,12,16,.25),rgba(11,12,16,.55)),
      url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450"><rect width="800" height="450" fill="%23c8944a"/><rect y="250" width="800" height="200" fill="%23b8843a"/><circle cx="400" cy="230" r="60" fill="none" stroke="%23000" stroke-width="3" opacity="0.3"/></svg>');
    background-size:cover; background-position:center; }
  .video .big-play { width:66px; height:66px; border-radius:50%; background:rgba(0,0,0,.4); backdrop-filter:blur(4px); border:2px solid rgba(255,255,255,.85); display:flex; align-items:center; justify-content:center; cursor:pointer; transition:transform .12s; }
  .video .big-play:active { transform:scale(.94); }
  .video .big-play::after { content:''; border-left:20px solid #fff; border-top:13px solid transparent; border-bottom:13px solid transparent; margin-left:5px; }

  /* ===== SCRUBBER (tightened, sits close to tags) ===== */
  .scrubber-zone { flex-shrink:0; background:var(--panel); border-top:1px solid var(--line); padding:9px 18px 7px; }
  .scrub-track { position:relative; height:6px; background:var(--line); border-radius:3px; cursor:pointer; }
  .scrub-fill { position:absolute; left:0; top:0; bottom:0; width:64%; background:var(--accent); border-radius:3px; }
  .scrub-head { position:absolute; top:50%; left:64%; transform:translate(-50%,-50%); width:15px; height:15px; border-radius:50%; background:#fff; box-shadow:0 0 0 4px var(--accent-glow); }
  .period-timeline { display:flex; gap:3px; margin-top:6px; }
  .seg { flex:1; height:5px; border-radius:3px; background:var(--line); position:relative; overflow:hidden; }
  .seg.done { background:rgba(255,255,255,.35); }
  .seg.active::after { content:''; position:absolute; left:0; top:0; bottom:0; width:64%; background:var(--accent); }
  .seg-labels { display:flex; gap:3px; margin-top:3px; }
  .seg-label { flex:1; text-align:center; font-size:9px; font-weight:700; color:var(--text-faint); letter-spacing:.5px; }
  .seg-label.active { color:var(--text-dim); }
  .transport { display:flex; align-items:center; gap:12px; margin-top:8px; }
  .t-btn { background:var(--panel-2); border:1px solid var(--line); color:var(--text); width:38px; height:32px; border-radius:8px; font-size:13px; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all .12s; }
  .t-btn:active { background:var(--line); }
  .t-play { width:46px; background:#fff; color:#000; }
  .t-time { font-size:13px; font-weight:700; font-variant-numeric:tabular-nums; color:var(--text); }
  .t-time .total { color:var(--text-faint); font-weight:600; }
  .t-right { margin-left:auto; display:flex; align-items:center; gap:10px; }
  .speed-pill { background:var(--panel-2); border:1px solid var(--line); font-size:11px; font-weight:700; padding:5px 9px; border-radius:14px; color:var(--text-dim); cursor:pointer; }

  /* ===== CLIP-IN-PROGRESS TRAY (auto-saves on commit) ===== */
  .tray { flex-shrink:0; background:linear-gradient(var(--panel-2),var(--panel)); border-top:1px solid var(--line); border-bottom:1px solid var(--line); padding:8px 18px; min-height:50px; display:flex; align-items:center; gap:12px; transition:border-color .2s; }
  .tray.building { border-top-color:var(--accent); }
  .tray-label { font-size:10px; font-weight:800; letter-spacing:1px; color:var(--text-faint); text-transform:uppercase; flex-shrink:0; }
  .tray-chips { flex:1; display:flex; align-items:center; gap:8px; flex-wrap:wrap; min-height:20px; }
  .tray-empty-hint { color:var(--text-faint); font-size:13px; font-style:italic; }
  .built-chip { display:inline-flex; align-items:center; gap:6px; background:var(--panel); border:1px solid var(--line); padding:5px 10px 5px 6px; border-radius:20px; font-size:12px; font-weight:700; animation:pop .18s ease; }
  @keyframes pop { from { transform:scale(.8); opacity:0; } to { transform:scale(1); opacity:1; } }
  .built-chip .role-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
  .built-chip .x { color:var(--text-faint); cursor:pointer; font-size:13px; margin-left:2px; }
  .plus-join { color:var(--text-faint); font-weight:800; font-size:13px; }
  .tray-actions { display:flex; gap:8px; flex-shrink:0; }
  .flag-toggle { background:var(--panel-2); border:1px solid var(--line); color:var(--text-faint); height:38px; padding:0 12px; border-radius:9px; cursor:pointer; font-size:13px; font-weight:700; display:flex; align-items:center; gap:6px; }
  .flag-toggle.star.on { color:var(--star); border-color:var(--star); background:#f5c51811; }
  .flag-toggle.poe.on { color:var(--poe); border-color:var(--poe); background:#ff9f4311; }
  .clear-clip { background:var(--panel-2); border:1px solid var(--line); color:var(--text-dim); font-size:12px; font-weight:600; padding:0 12px; height:38px; border-radius:9px; cursor:pointer; }
  .done-clip { background:var(--accent); color:#fff; border:none; font-size:13px; font-weight:800; padding:0 18px; height:38px; border-radius:9px; cursor:pointer; display:flex; align-items:center; gap:8px; transition:all .12s; }
  .done-clip:disabled { opacity:.35; cursor:default; }
  .done-clip:not(:disabled):active { transform:scale(.97); }
  .done-clip .kbd { background:rgba(255,255,255,.2); padding:1px 6px; border-radius:4px; font-size:10px; }

  /* ===== TAG GRID ===== */
  .tag-zone { flex-shrink:0; background:var(--bg); padding:11px 18px 13px; display:flex; gap:14px; }
  .tag-col { display:flex; flex-direction:column; }
  .tag-col.players { flex:0 0 auto; }
  .cat-head { display:flex; align-items:center; gap:6px; margin-bottom:8px; font-size:10px; font-weight:800; letter-spacing:1px; text-transform:uppercase; }
  .cat-head .cdot { width:8px; height:8px; border-radius:50%; }
  .cat-head.players { color:var(--players); } .cat-head.players .cdot { background:var(--players); }
  .cat-head.offense { color:var(--offense); } .cat-head.offense .cdot { background:var(--offense); }
  .cat-head.defense { color:var(--defense); } .cat-head.defense .cdot { background:var(--defense); }
  .cat-head.plays   { color:var(--plays);   } .cat-head.plays .cdot   { background:var(--plays); }
  .chips { display:grid; gap:6px; }
  .players .chips { grid-template-columns:repeat(5,1fr); }
  .offense .chips, .defense .chips, .plays .chips { grid-template-columns:repeat(2,1fr); }
  .divider { width:1px; background:var(--line-soft); align-self:stretch; }
  .chip { border:1px solid var(--line); background:var(--panel); border-radius:18px; padding:7px 6px; cursor:pointer; font-size:12px; font-weight:700; text-align:center; white-space:nowrap; display:flex; align-items:center; justify-content:center; gap:5px; transition:all .1s; user-select:none; min-height:33px; }
  .chip:hover { border-color:var(--text-faint); }
  .chip:active { transform:scale(.95); }
  .chip .num { font-size:9px; background:var(--panel-2); color:var(--text-faint); width:16px; height:16px; border-radius:5px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .chip .kbd { font-size:9px; color:var(--text-faint); border:1px solid var(--line); border-radius:4px; padding:0 4px; margin-left:2px; }
  .players .chip.selected { background:var(--players); border-color:var(--players); color:#1a1030; }
  .players .chip.selected .num { background:rgba(0,0,0,.2); color:#1a1030; }
  .offense .chip { border-color:#4a90e244; color:#a9cbf0; background:var(--offense-bg); }
  .offense .chip.made { color:#8fe0a8; border-color:#3ec46d55; background:#3ec46d18; }
  .offense .chip.selected { background:var(--offense); color:#fff; border-color:var(--offense); }
  .offense .chip.made.selected { background:var(--made); border-color:var(--made); color:#0a1f12; }
  .defense .chip { border-color:#e2574a44; color:#f0a9a2; background:var(--defense-bg); }
  .defense .chip.selected { background:var(--defense); color:#fff; border-color:var(--defense); }
  .plays .chip { border-color:#3ec46d44; color:#9fe0b5; background:var(--plays-bg); }
  .plays .chip.selected { background:var(--plays); color:#0a1f12; border-color:var(--plays); }

  /* ===== CLIPS PANEL ===== */
  .clips-head { padding:14px 16px 10px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--line); }
  .clips-head .ct { font-size:11px; font-weight:800; letter-spacing:1px; color:var(--text-faint); text-transform:uppercase; }
  .clips-head .cn { font-size:11px; color:var(--text-dim); }
  .clips-list { flex:1; overflow-y:auto; padding:10px; }
  .clips-list::-webkit-scrollbar { width:8px; }
  .clips-list::-webkit-scrollbar-thumb { background:var(--line); border-radius:4px; }
  .clip-card { background:var(--panel-2); border:1px solid var(--line); border-radius:11px; padding:11px; margin-bottom:9px; animation:pop .2s ease; }
  .clip-card.newest { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent-glow); }
  .clip-card .ctime { font-size:11px; font-weight:700; color:var(--text-dim); font-variant-numeric:tabular-nums; }
  .clip-card .ctags { display:flex; flex-wrap:wrap; gap:5px; margin-top:7px; align-items:center; }
  .mini-tag { font-size:11px; font-weight:700; padding:3px 9px; border-radius:12px; white-space:nowrap; }
  .mini-tag.player { background:var(--players); color:#1a1030; }
  .mini-tag.off { background:var(--made); color:#0a1f12; }
  .mini-tag.off-neutral { background:var(--offense); color:#fff; }
  .mini-tag.def { background:var(--defense); color:#fff; }
  .mini-tag.play { background:var(--plays); color:#0a1f12; }
  .mini-join { color:var(--text-faint); font-size:11px; font-weight:800; }
  .clip-card .cfoot { display:flex; align-items:center; gap:10px; margin-top:7px; font-size:10px; color:var(--text-faint); font-weight:700; }
  .clip-card .cfoot .star { color:var(--star); }
  .clip-card .cfoot .poe { color:var(--poe); }

  .shortcut-bar { flex-shrink:0; padding:8px 18px; background:var(--panel); border-top:1px solid var(--line); display:flex; align-items:center; gap:15px; font-size:11px; color:var(--text-faint); flex-wrap:wrap; }
  .shortcut-bar .sc { display:flex; align-items:center; gap:6px; }
  .shortcut-bar .kbd { border:1px solid var(--line); border-radius:4px; padding:1px 6px; font-weight:700; color:var(--text-dim); }
  .shortcut-bar .hint { margin-left:auto; color:var(--accent); font-weight:600; }

  .toast { position:fixed; bottom:80px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--accent); color:#fff; font-size:13px; font-weight:700; padding:10px 18px; border-radius:22px; opacity:0; pointer-events:none; transition:all .25s; z-index:100; }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
</style>

<!-- TOP BAR -->
<div class="topbar">
  <div class="brand"><div class="logo">🏀</div> Studio</div>
  <div class="game-label"><b>Regents 2033</b> · vs Oak Hill Academy</div>
  <div class="period-tabs" id="periods"></div>
  <button class="mode-toggle" id="modeToggle" onclick="toggleMode()"></button>
  <div class="topbar-right">
    <button class="mode-toggle" onclick="toggleFS()" title="Full screen studio">⛶ Full screen</button>
    <div class="autosave"><span class="dot"></span> Autosaved</div>
    <div class="avatar">AM</div>
  </div>
</div>

<div class="main">
  <div class="stage">
    <div class="video"><div class="video-frame"><div class="big-play" onclick="toast('▶ playing')"></div></div></div>

    <!-- SCRUBBER -->
    <div class="scrubber-zone">
      <div class="scrub-track" onclick="toast('seek')"><div class="scrub-fill"></div><div class="scrub-head"></div></div>
      <div class="period-timeline" id="periodTimeline"></div>
      <div class="seg-labels" id="segLabels"></div>
      <div class="transport">
        <div class="t-btn" onclick="toast('⏮')">⏮</div>
        <div class="t-btn" onclick="toast('−5s')">−5s</div>
        <div class="t-btn t-play" onclick="toast('⏯')">⏯</div>
        <div class="t-btn" onclick="toast('+5s')">+5s</div>
        <div class="t-btn" onclick="toast('⏭')">⏭</div>
        <div class="t-time">07:32 <span class="total">/ 11:48</span></div>
        <div class="t-right"><div class="speed-pill" onclick="toast('speed')">⚡ 1.5×</div></div>
      </div>
    </div>

    <!-- CLIP-IN-PROGRESS TRAY -->
    <div class="tray" id="tray">
      <div class="tray-label">Building clip</div>
      <div class="tray-chips" id="trayChips"></div>
      <div class="tray-actions">
        <button class="flag-toggle star" id="starBtn" onclick="toggleStar()" title="Highlight">★</button>
        <button class="flag-toggle poe" id="poeBtn" onclick="togglePoe()" title="Point of Emphasis">◎ POE</button>
        <button class="clear-clip" id="clearBtn" onclick="clearClip()" style="display:none">Clear</button>
        <button class="done-clip" id="doneBtn" onclick="saveClip()" disabled>Done <span class="kbd">↵</span></button>
      </div>
    </div>

    <!-- TAG GRID -->
    <div class="tag-zone">
      <div class="tag-col players"><div class="cat-head players"><span class="cdot"></span> Players</div><div class="chips" id="playerChips"></div></div>
      <div class="divider"></div>
      <div class="tag-col offense" style="flex:1"><div class="cat-head offense"><span class="cdot"></span> Offense</div><div class="chips" id="offenseChips"></div></div>
      <div class="divider"></div>
      <div class="tag-col defense" style="flex:1"><div class="cat-head defense"><span class="cdot"></span> Defense</div><div class="chips" id="defenseChips"></div></div>
      <div class="divider"></div>
      <div class="tag-col plays" style="flex:1"><div class="cat-head plays"><span class="cdot"></span> Plays</div><div class="chips" id="playsChips"></div></div>
    </div>

    <!-- SHORTCUTS -->
    <div class="shortcut-bar">
      <div class="sc"><span class="kbd">Space</span> play / pause</div>
      <div class="sc"><span class="kbd">←</span><span class="kbd">→</span> ±1s</div>
      <div class="sc"><span class="kbd">↑</span> +5s <span class="kbd">↓</span> −5s</div>
      <div class="sc"><span class="kbd">1-9</span> player</div>
      <div class="sc"><span class="kbd">Q W E…</span> event</div>
      <div class="sc"><span class="kbd">↵</span> done <span class="kbd">⌫</span> clear</div>
      <div class="hint">Build → auto-saves. One clip holds many tags.</div>
    </div>
  </div>

  <!-- CLIPS PANEL -->
  <div class="clips-panel">
    <div class="clips-head"><span class="ct">Clips · <span id="clipsPeriod">Q1</span></span><span class="cn" id="clipCount">6 saved</span></div>
    <div class="clips-list" id="clipsList"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  // ---- period mode (Quarters / Halves) ----
  const PERIODS = { quarters:['Q1','Q2','Q3','Q4'], halves:['1st','2nd'] };
  let periodMode = 'quarters', activePeriod = 0;
  function renderPeriods(){
    const L = PERIODS[periodMode];
    document.getElementById('periods').innerHTML = L.map((l,i)=>`<button class="${i===activePeriod?'active':''}" onclick="setPeriod(${i})">${l}</button>`).join('');
    document.getElementById('periodTimeline').innerHTML = L.map((l,i)=>`<div class="seg ${i<activePeriod?'done':''} ${i===activePeriod?'active':''}"></div>`).join('');
    document.getElementById('segLabels').innerHTML = L.map((l,i)=>`<div class="seg-label ${i===activePeriod?'active':''}">${l}</div>`).join('');
    document.getElementById('modeToggle').textContent = periodMode==='quarters' ? 'Use Halves' : 'Use Quarters';
    document.getElementById('clipsPeriod').textContent = L[activePeriod];
  }
  function setPeriod(i){ activePeriod=i; renderPeriods(); }
  function toggleMode(){ periodMode = periodMode==='quarters'?'halves':'quarters'; activePeriod=0; renderPeriods(); toast(periodMode==='halves'?'Halves':'Quarters'); }

  // ---- tag data ----
  const players = [
    {n:'#23 Smith',k:'1'},{n:'#04 Jones',k:'2'},{n:'#11 Davis',k:'3'},{n:'#10 Lee',k:'4'},{n:'#05 Reyes',k:'5'},
    {n:'#32 Miller',k:'6'},{n:'#14 Brooks',k:'7'},{n:'#21 Nguyen',k:'8'},{n:'#33 Kelly',k:'9'},{n:'#02 Ruiz',k:'0'}
  ];
  const offense = [
    {n:'Made 2',k:'Q',made:true},{n:'Miss 2',k:'A',made:false},
    {n:'Made 3',k:'W',made:true},{n:'Miss 3',k:'S',made:false},
    {n:'Made FT',k:'E',made:true},{n:'Miss FT',k:'D',made:false},
    {n:'Assist',k:'R'},{n:'Off Reb',k:'F'},
    {n:'Turnover',k:'T'},{n:'And-1',k:'G'}
  ];
  const defense = [
    {n:'Steal',k:'Z'},{n:'Block',k:'X'},{n:'Def Reb',k:'C'},{n:'Foul',k:'V'},
    {n:'Deflection',k:'B'},{n:'Charge',k:'N'},{n:'Contest',k:'M'},{n:'Box Out',k:'H'},
    {n:'Help',k:'Y'},{n:'Rotation',k:'U'}
  ];
  const plays = [
    {n:'Ball Screen',k:'P'},{n:'Off Screen',k:'O'},{n:'DHO',k:'I'},{n:'Cut',k:'K'},
    {n:'Iso',k:'J'},{n:'Post Up',k:'L'},{n:'Transition',k:'.'},{n:'Press',k:','},
    {n:'Zone',k:';'},{n:'Horns',k:'/'}
  ];

  let building = [], isStar=false, isPoe=false;
  let clips = [
    {t:'07:28', tags:[{l:'#23 Smith',c:'player'},{l:'Made 2',c:'off'}], star:true},
    {t:'06:55', tags:[{l:'#11 Davis',c:'player'},{l:'Steal',c:'def'},{l:'Transition',c:'play'}], poe:true},
    {t:'06:10', tags:[{l:'#04 Jones',c:'player'},{l:'Assist',c:'off-neutral'}]},
    {t:'05:32', tags:[{l:'#32 Miller',c:'player'},{l:'Block',c:'def'}]},
    {t:'04:48', tags:[{l:'#10 Lee',c:'player'},{l:'Made 3',c:'off'}], star:true},
    {t:'03:57', tags:[{l:'#05 Reyes',c:'player'},{l:'Turnover',c:'off-neutral'}]},
  ];

  function chip(item, cat){
    const madeClass = item.made===true ? ' made' : '';
    const badge = cat==='players' ? `<span class="num">${item.k}</span>` : `<span class="kbd">${item.k}</span>`;
    const left = cat==='players' ? badge : '';
    const right = cat==='players' ? '' : badge;
    return `<div class="chip${madeClass}" data-cat="${cat}" data-label="${item.n}" data-made="${item.made}" data-key="${item.k}" onclick="tapChip(this)">${left}<span>${item.n}</span>${right}</div>`;
  }
  playerChips.innerHTML  = players.map(p=>chip(p,'players')).join('');
  offenseChips.innerHTML = offense.map(o=>chip(o,'offense')).join('');
  defenseChips.innerHTML = defense.map(d=>chip(d,'defense')).join('');
  playsChips.innerHTML   = plays.map(p=>chip(p,'plays')).join('');

  function tapChip(el){
    const {label,cat,made} = el.dataset;
    const i = building.findIndex(b=>b.label===label && b.cat===cat);
    if (i>=0){ building.splice(i,1); el.classList.remove('selected'); }
    else { building.push({label,cat,made}); el.classList.add('selected'); }
    renderTray();
  }
  function roleColor(cat,made){
    if(cat==='players')return 'var(--players)';
    if(cat==='offense')return made==='true'?'var(--made)':'var(--offense)';
    if(cat==='defense')return 'var(--defense)';
    if(cat==='plays')return 'var(--plays)';
    return 'var(--text-dim)';
  }
  function renderTray(){
    const tray=document.getElementById('tray'), chips=document.getElementById('trayChips');
    const done=document.getElementById('doneBtn'), clear=document.getElementById('clearBtn');
    if(building.length===0){
      chips.innerHTML='<span class="tray-empty-hint">Tap an event, then a player — stack as many as you want</span>';
      tray.classList.remove('building'); done.disabled=true; clear.style.display='none'; return;
    }
    tray.classList.add('building'); done.disabled=false; clear.style.display='block';
    chips.innerHTML = building.map((b,i)=>{
      const join = i>0?'<span class="plus-join">+</span>':'';
      return `${join}<span class="built-chip"><span class="role-dot" style="background:${roleColor(b.cat,b.made)}"></span>${b.label}<span class="x" onclick="removeBuilt(${i})">×</span></span>`;
    }).join('');
  }
  function removeBuilt(i){
    const r=building[i]; building.splice(i,1);
    document.querySelectorAll('.chip.selected').forEach(el=>{ if(el.dataset.label===r.label && el.dataset.cat===r.cat) el.classList.remove('selected'); });
    renderTray();
  }
  function clearClip(){
    building=[]; isStar=false; isPoe=false;
    document.getElementById('starBtn').classList.remove('on');
    document.getElementById('poeBtn').classList.remove('on');
    document.querySelectorAll('.chip.selected').forEach(el=>el.classList.remove('selected'));
    renderTray();
  }
  function toggleStar(){ isStar=!isStar; document.getElementById('starBtn').classList.toggle('on',isStar); }
  function togglePoe(){ isPoe=!isPoe; document.getElementById('poeBtn').classList.toggle('on',isPoe); }
  function tagClass(b){
    if(b.cat==='players')return 'player';
    if(b.cat==='offense')return b.made==='true'?'off':'off-neutral';
    if(b.cat==='defense')return 'def';
    if(b.cat==='plays')return 'play';
    return '';
  }
  function saveClip(){
    if(building.length===0)return;
    clips.forEach(c=>c.newest=false);
    clips.unshift({ t:'07:32', tags:building.map(b=>({l:b.label,c:tagClass(b)})), star:isStar, poe:isPoe, newest:true });
    renderClips();
    toast('Clip saved · autosaved');
    clearClip();
  }
  function renderClips(){
    document.getElementById('clipCount').textContent = clips.length+' saved';
    document.getElementById('clipsList').innerHTML = clips.map(c=>{
      const tags=c.tags.map((t,i)=>`${i>0?'<span class="mini-join">+</span>':''}<span class="mini-tag ${t.c}">${t.l}</span>`).join('');
      const foot=(c.star||c.poe)?`<div class="cfoot">${c.star?'<span class="star">★ Highlight</span>':''}${c.poe?'<span class="poe">◎ POE</span>':''}</div>`:'';
      return `<div class="clip-card ${c.newest?'newest':''}"><div class="ctime">${c.t}</div><div class="ctags">${tags}</div>${foot}</div>`;
    }).join('');
  }

  // ---- keyboard ----
  document.addEventListener('keydown',(e)=>{
    const tag=e.target.tagName;
    if(tag==='INPUT'||tag==='TEXTAREA')return;
    if(e.key===' '){ e.preventDefault(); toast('⏯ play / pause'); return; }
    if(e.key==='ArrowLeft'){ e.preventDefault(); toast('◀ −1s'); return; }
    if(e.key==='ArrowRight'){ e.preventDefault(); toast('▶ +1s'); return; }
    if(e.key==='ArrowUp'){ e.preventDefault(); toast('⏫ +5s'); return; }
    if(e.key==='ArrowDown'){ e.preventDefault(); toast('⏬ −5s'); return; }
    if(e.key==='Enter'){ e.preventDefault(); saveClip(); return; }
    if(e.key==='Backspace'){ e.preventDefault(); clearClip(); return; }
    // tag hotkeys (event categories by letter, players by number)
    const k=e.key.toUpperCase();
    let matched=false;
    document.querySelectorAll('.chip[data-cat="offense"],.chip[data-cat="defense"],.chip[data-cat="plays"]').forEach(el=>{
      if(el.dataset.key===k){ tapChip(el); matched=true; }
    });
    if(!matched && /[0-9]/.test(e.key)){
      document.querySelectorAll('.chip[data-cat="players"]').forEach(el=>{ if(el.dataset.key===e.key) tapChip(el); });
    }
  });

  function toggleFS(){
    try{
      if(!document.fullscreenElement){ (document.documentElement.requestFullscreen||document.documentElement.webkitRequestFullscreen).call(document.documentElement); toast('Full screen'); }
      else { document.exitFullscreen(); }
    }catch(e){ toast('Full screen (blocked in preview)'); }
  }
  let toastTimer;
  function toast(msg){
    const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
    clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),1400);
  }

  renderPeriods(); renderTray(); renderClips();
</script>
