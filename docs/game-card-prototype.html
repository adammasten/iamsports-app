<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>IamSports — Game Card Redesign</title>
<!--
  CANONICAL DESIGN REFERENCE for the card system (the version Adam loved, 2026-08-11).
  Tokens, card, detail (Watch/Tag toggle + rows + Game actions), fullscreen player with
  the dual progress bar, and the overflow sheet. Build to THIS.

  Key tokens: bg #0a0a0c · surface #16161a · surface-2 #1e1e24 · line #2a2a32 ·
  text #f4f4f6 · text-dim #9a9aa5 · text-faint #62626c · accent #6c5ce7 · radius 16.
  Card = big 16:9 thumbnail + "≡ N videos" chip (top-right) + share chip (top-left,
  wall) + center play (wall) + body(name, date·result, ↗/⬇). Detail = Watch/Tag toggle
  (Film Room only) + rows(92x56 thumb + dur badge + name + "Uploaded date" + ⋯) + Game
  actions(Share/Offline/Add). Player = fullscreen, dual bar (segmented game timeline +
  within-video bar) + transport + auto-advance ("plays through").
-->
<style>
  :root {
    --bg: #0a0a0c; --surface: #16161a; --surface-2: #1e1e24; --line: #2a2a32;
    --text: #f4f4f6; --text-dim: #9a9aa5; --text-faint: #62626c;
    --accent: #6c5ce7; --accent-soft: #6c5ce733;
    --offense: #4a90e2; --defense: #e2574a; --plays: #3ec46d; --star: #f5c518;
    --radius: 16px;
  }
  /* Full prototype markup + styles preserved verbatim in git history at this path.
     (Trimmed here for brevity — the tokens + structure above are the build spec.) */
</style>
</head>
<body>
  <!-- See the design notes above. Card, detail (Watch/Tag), fullscreen dual-bar player,
       and overflow sheet. Wall adds a center play-badge + "Shared" chip + coach note;
       Film Room hides those and shows the Watch/Tag toggle in the detail. -->
</body>
</html>
